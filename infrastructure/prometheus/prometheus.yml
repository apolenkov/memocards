---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'memocards-production'
    environment: 'production'

# Alerting configuration
# Alertmanager integration for notifications
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      # Timeout for sending alerts to Alertmanager
      timeout: 10s
      # API version (v1 is default)
      api_version: v2

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Application metrics via Docker service discovery
  - job_name: 'memocards'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/actuator/prometheus'
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      # Filter 1: Only keep containers with name matching memocards-app
      # Docker container names include leading slash: /memocards-app-prod
      - source_labels: ['__meta_docker_container_name']
        regex: '.*/memocards-app.*'
        action: keep
      # Filter 2: Only keep containers with service label = 'app'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^app$'
        action: keep
      # Filter 3: Only keep targets with port 8080 in address
      # Docker SD sets __address__ from container IP and port, so we check the address contains :8080
      - source_labels: ['__address__']
        regex: '.*:8080$'
        action: keep
      # Set labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'application'
        replacement: 'memocards'
      - target_label: 'environment'
        replacement: 'production'
      - target_label: 'instance'
        replacement: 'memocards-app'

  # Loki metrics via Docker service discovery
  - job_name: 'loki'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-loki.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:3100'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Promtail metrics via Docker service discovery
  - job_name: 'promtail'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-promtail.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:9080'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Node exporter metrics via Docker service discovery
  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      # Filter 1: Only keep containers with name matching memocards-node-exporter
      # Docker container names include leading slash: /memocards-node-exporter-prod
      - source_labels: ['__meta_docker_container_name']
        regex: '.*/memocards-node-exporter.*'
        action: keep
      # Filter 2: Only keep containers with service label = 'node-exporter'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^node-exporter$'
        action: keep
      # Set address from container IP and port 9100
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:9100'
      # Set labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'application'
        replacement: 'memocards'
      - target_label: 'environment'
        replacement: 'production'
      - target_label: 'instance'
        replacement: 'node-exporter'

  # cAdvisor metrics via Docker service discovery
  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      # Filter 1: Only keep containers with name matching memocards-cadvisor
      # Docker container names include leading slash: /memocards-cadvisor
      - source_labels: ['__meta_docker_container_name']
        regex: '.*/memocards-cadvisor.*'
        action: keep
      # Filter 2: Only keep containers with service label = 'cadvisor'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^cadvisor$'
        action: keep
      # Filter 3: Only keep targets with port 8080 in address
      - source_labels: ['__address__']
        regex: '.*:8080$'
        action: keep
      # Set labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'application'
        replacement: 'memocards'
      - target_label: 'environment'
        replacement: 'production'
      - target_label: 'instance'
        replacement: 'cadvisor'
