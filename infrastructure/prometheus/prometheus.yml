---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'memocards-production'
    environment: 'production'

# Alerting configuration
# Note: Alertmanager is not configured yet, but rules are evaluated
# To enable Alertmanager, add:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Application metrics via Docker service discovery
  - job_name: 'memocards'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/actuator/prometheus'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Keep only app containers
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-app.*'
        action: keep
      # Use container IP and exposed port 8080
      - source_labels: ['__meta_docker_container_ip', '__meta_docker_container_port_private_8080']
        regex: '(.+):(\d+)'
        target_label: '__address__'
        replacement: '${1}:${2}'
      # Set labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'application'
        replacement: 'memocards'
      - target_label: 'environment'
        replacement: 'production'
      - target_label: 'instance'
        replacement: 'memocards-app'

  # Loki metrics via Docker service discovery
  - job_name: 'loki'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-loki.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:3100'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Promtail metrics via Docker service discovery
  - job_name: 'promtail'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-promtail.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:9080'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Node exporter metrics via Docker service discovery
  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-node-exporter.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:9100'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # cAdvisor metrics via Docker service discovery
  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s  # Infrastructure services change less frequently
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: 'memocards-cadvisor.*'
        action: keep
      - source_labels: ['__meta_docker_container_ip']
        regex: '(.+)'
        target_label: '__address__'
        replacement: '${1}:8080'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
