---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'memocards-production'
    environment: 'production'

# Alerting configuration
# Note: Alertmanager is not configured yet, but rules are evaluated
# To enable Alertmanager, add:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Scrape application metrics
  # Note: When container_name is set, Docker Compose doesn't create DNS entry for service name
  # We use container_name directly - Prometheus will resolve it to IP address automatically
  - job_name: 'memocards'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['memocards-app-prod:8080']
        labels:
          application: 'memocards'
          environment: 'production'
          service: 'application'
          instance: 'memocards-app'

  # Loki metrics
  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Promtail metrics
  - job_name: 'promtail'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          service: 'promtail'

  # Node exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'

  # cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
