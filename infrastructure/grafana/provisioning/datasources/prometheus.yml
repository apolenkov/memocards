apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Using service name via network alias (container_name: memocards-prometheus)
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
    editable: false

  - name: Loki
    type: loki
    access: proxy
    # Using service name via network alias (container_name: memocards-loki)
    url: http://loki:3100
    jsonData:
      maxLines: 500
    editable: false

