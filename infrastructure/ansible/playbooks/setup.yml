---
# =============================================================================
# PLAYBOOK: setup.yml
# Complete Memocards infrastructure setup on VPS
# =============================================================================
#
# This playbook performs initial installation of the entire infrastructure:
# - Basic system configuration (common)
# - Docker installation (docker)
# - Nginx installation and SSL configuration (nginx)
# - Application deployment (app)
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.yml setup.yml --ask-vault-pass
#
# Or with dry run (check without changes):
#   ansible-playbook -i ../inventory/hosts.yml setup.yml --ask-vault-pass --check
# =============================================================================

- name: Deploy Memocards Infrastructure on VPS
  hosts: vps
  become: true
  gather_facts: true

  vars_files:
    - ../inventory/group_vars/all.yml
    - ../secrets.yml

  pre_tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║     Memocards Infrastructure Deployment Starting...        ║
          ╚════════════════════════════════════════════════════════════╝

          🎯 Target: {{ inventory_hostname }}
          🐧 Starting deployment...
          ⏱️  This will take approximately 10-15 minutes...
      tags: [always]
      when: ansible_facts is defined

    - name: Validate server prerequisites
      tags: [always, prerequisites]
      block:
        - name: Check OS compatibility
          ansible.builtin.assert:
            that:
              - ansible_distribution in ['Ubuntu', 'Debian']
            fail_msg: "❌ OS not supported. Requires Ubuntu or Debian"
            success_msg: "✅ OS compatible: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          tags: [always, prerequisites]

        - name: Check OS version compatibility
          ansible.builtin.assert:
            that:
              - (ansible_distribution == 'Ubuntu' and (ansible_distribution_major_version | int >= 20)) or (ansible_distribution == 'Debian' and
                (ansible_distribution_major_version | int >= 11))
            fail_msg: "❌ OS version not supported. Requires Ubuntu 20.04+ or Debian 11+"
            success_msg: "✅ OS version compatible: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          tags: [always, prerequisites]

        - name: Check Python3 installation
          ansible.builtin.command: python3 --version
          register: python3_check
          changed_when: false
          failed_when: python3_check.rc != 0
          tags: [always, prerequisites]

        - name: Install Python3 if missing
          ansible.builtin.apt:
            name: python3
            state: present
          when: python3_check.rc != 0
          tags: [always, prerequisites]

        - name: Check minimum RAM (2GB)
          ansible.builtin.set_fact:
            total_ram_gb: "{{ (ansible_memtotal_mb / 1024) | round(0) }}"
          tags: [always, prerequisites]

        - name: Display RAM information
          ansible.builtin.debug:
            msg: "📊 RAM: {{ total_ram_gb }}GB available (requires minimum 2GB)"
          tags: [always, prerequisites]

        - name: Fail if insufficient RAM
          ansible.builtin.fail:
            msg: "❌ Insufficient RAM: {{ total_ram_gb }}GB (requires minimum 2GB)"
          when: total_ram_gb | int < 2
          tags: [always, prerequisites]

        - name: Check minimum disk space (10GB free)
          ansible.builtin.shell: |
            set -o pipefail
            df -BG / | tail -1 | awk '{print $4}'
          args:
            executable: /bin/bash
          register: disk_free
          changed_when: false
          tags: [always, prerequisites]

        - name: Display disk space information
          ansible.builtin.debug:
            msg: "💾 Disk space: {{ disk_free.stdout }} free (requires minimum 10GB)"
          tags: [always, prerequisites]

        - name: Warn if insufficient disk space
          ansible.builtin.debug:
            msg: "⚠️  WARNING: Disk space may be insufficient: {{ disk_free.stdout }} free (recommended minimum 10GB, but continuing anyway)"
          when: (disk_free.stdout | regex_replace('G', '') | int) < 10
          tags: [always, prerequisites]

        - name: Check internet connectivity
          ansible.builtin.uri:
            url: https://www.google.com
            method: GET
            timeout: 5
            status_code: [200, 301, 302]
          register: internet_check
          failed_when: false
          tags: [always, prerequisites]

        - name: Warn if no internet
          ansible.builtin.debug:
            msg: "⚠️  WARNING: Internet connectivity check failed. Deployment may fail without internet."
          when: internet_check.status | default(0) not in [200, 301, 302]
          tags: [always, prerequisites]

        - name: Display prerequisites validation success
          ansible.builtin.debug:
            msg: |
              ✅ Prerequisites validation passed:
              - OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
              - Python3: Installed
              - RAM: {{ total_ram_gb }}GB
              - Disk: {{ disk_free.stdout }} free
              - Internet: {{ 'Connected' if internet_check.status | default(0) in [200, 301, 302] else 'Check failed' }}
          tags: [always, prerequisites]

    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [always]

    - name: Validate inventory configuration
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host != ""
          - ansible_user is defined
          - ansible_user != ""
        fail_msg: "❌ Invalid inventory configuration. Check inventory/hosts.yml"
        success_msg: "✅ Inventory configuration valid: {{ ansible_host }} (user: {{ ansible_user }})"
      tags: [always, prerequisites]

    - name: Validate secrets file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../secrets.yml"
      register: secrets_file
      delegate_to: localhost
      run_once: true
      become: false
      tags: [always, prerequisites]

    - name: Fail if secrets file missing
      ansible.builtin.fail:
        msg: |
          ❌ secrets.yml not found!

          To fix:
          1. Copy template: cp secrets.yml.example secrets.yml
          2. Edit with: ansible-vault edit secrets.yml
          3. Fill in required secrets
      when: not secrets_file.stat.exists
      delegate_to: localhost
      run_once: true
      become: false
      tags: [always, prerequisites]

    - name: Validate required secrets are defined
      ansible.builtin.assert:
        that:
          - vault_db_password is defined
          - vault_github_token is defined
          - vault_grafana_admin_password is defined
          - vault_duckdns_token is defined
          - vault_traefik_dashboard_password_hash is defined
        fail_msg: |
          ❌ Missing required secrets in secrets.yml!

          Required secrets:
          - vault_db_password
          - vault_github_token
          - vault_grafana_admin_password
          - vault_duckdns_token
          - vault_traefik_dashboard_password_hash

          To fix: ansible-vault edit secrets.yml
        success_msg: "✅ All required secrets are defined"
      tags: [always, prerequisites]
      when: secrets_file.stat.exists | default(false)

    - name: Install Ansible collections (if missing)
      ansible.builtin.command: ansible-galaxy collection install -r {{ playbook_dir }}/../requirements.yml
      delegate_to: localhost
      run_once: true
      become: false
      changed_when: false
      failed_when: false
      tags: [always, bootstrap]

  roles:
    - role: common
      tags: [common, setup]

    - role: docker
      tags: [docker, setup]

    - role: nginx
      tags: [nginx, setup]

    - role: app
      tags: [app, setup]

    - role: monitoring
      tags: [monitoring, setup]

    - role: backup
      tags: [backup, setup]

  post_tasks:
    - name: Verify all containers are running
      ansible.builtin.shell: |
        set -o pipefail
        docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}" | grep -E "(NAMES|memocards)" || echo "No containers found"
      args:
        executable: /bin/bash
      register: container_status
      changed_when: false
      failed_when: false
      tags: [always, verify]
      when: container_status is not defined or 'verify' in ansible_run_tags

    - name: Clean up stopped containers (fixes cAdvisor duplicates)
      ansible.builtin.command:
        cmd: docker container prune -f
      register: container_cleanup
      changed_when: "'Total reclaimed space' in container_cleanup.stdout or 'No space reclaimed' not in container_cleanup.stdout"
      failed_when: false
      tags: [always, verify]

    - name: Display container cleanup results
      ansible.builtin.debug:
        msg: "🧹 Container cleanup: {{ container_cleanup.stdout | default('No stopped containers found') }}"
      when: container_cleanup.stdout is defined
      tags: [always, verify]

    - name: Ensure all services are up (start infrastructure if missing)
      ansible.builtin.shell: |
        cd {{ app_deploy_path }}
        set -e
        # Check if infrastructure services are running
        app_status=$(docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' memocards-app-prod 2>/dev/null || echo "missing")
        grafana_status=$(docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}' memocards-grafana-prod 2>/dev/null || echo "missing")
        traefik_status=$(docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}' memocards-traefik 2>/dev/null || echo "missing")

        # If infrastructure services are missing, start all services
        if [ "$grafana_status" = "missing" ] || [ "$traefik_status" = "missing" ]; then
          echo "Infrastructure services missing, starting all services with profile prod..."
          docker compose -p memocards-prod \
            -f docker-compose.yml \
            -f docker-compose.infrastructure.yml \
            -f docker-compose.prod.yml \
            --profile prod up -d --pull always --remove-orphans --force-recreate
        elif [ "$app_status" != "healthy" ]; then
          echo "App container status: $app_status, starting app and postgres..."
          docker compose -p memocards-prod \
            -f docker-compose.yml \
            -f docker-compose.infrastructure.yml \
            -f docker-compose.prod.yml \
            --profile prod up -d app postgres
        else
          echo "All services already running"
        fi
        exit 0
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      tags: [always, verify]

    - name: Wait for application container health=healthy
      ansible.builtin.shell: |
        for i in {1..120}; do
          status=$(docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' memocards-app-prod 2>/dev/null || echo missing)
          if [ "$status" = "healthy" ]; then exit 0; fi
          sleep 2
        done
        exit 1
      args:
        executable: /bin/bash
      register: app_container_health
      changed_when: false
      failed_when: false
      tags: [always, verify, healthcheck]
      when: "'quick' not in ansible_run_tags"

    - name: Wait for public routes to respond (/, /grafana, /prometheus, /traefik)
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        status_code: "{{ item.expected_status }}"
        timeout: 10
        validate_certs: false
      register: public_routes_check
      until: public_routes_check.status in item.expected_status
      retries: 60
      delay: 2
      changed_when: false
      failed_when: false
      loop:
        - { url: "https://{{ domain }}/", expected_status: [200] }
        - { url: "https://{{ domain }}/grafana/", expected_status: [200, 301, 302] }
        - { url: "https://{{ domain }}/prometheus/", expected_status: [401, 403] }
        - { url: "https://{{ domain }}/alertmanager/", expected_status: [401, 403] }
        - { url: "https://{{ domain }}/traefik/dashboard/", expected_status: [200, 401] }
      tags: [always, verify, healthcheck]
      when: "'quick' not in ansible_run_tags"

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║    🎉 Memocards Infrastructure Deployed Successfully!     ║
          ╚════════════════════════════════════════════════════════════╝

          📦 Components:
          ✅ System configured (firewall, swap, directories)
          ✅ Docker Engine installed and running
          ✅ Nginx installed with SSL (hybrid architecture: Nginx → Traefik → Services)
          ✅ Infrastructure deployed (Traefik, Prometheus, Alertmanager, Loki, Promtail, Grafana)
          ✅ Application deployed and healthy
          ✅ PostgreSQL database running
          ✅ Auto-restart enabled (Docker restart policy)
          ✅ Database backups configured (daily, weekly, monthly)
          ✅ Alert notifications configured (Alertmanager)

          🌐 Access:
          - Application: https://{{ domain }}
          - Grafana: https://{{ domain }}/grafana
          - Prometheus: https://{{ domain }}/prometheus
          - Alertmanager: https://{{ domain }}/alertmanager
          - Traefik Dashboard: https://{{ domain }}/traefik/dashboard/
          - Health: https://{{ domain }}/actuator/health

          📋 Next Steps:
          1. Test application: curl -I https://{{ domain }}
          2. Test Grafana: curl -I https://{{ domain }}/grafana
          3. Check logs: docker logs -f memocards-app-prod
          4. For updates: ansible-playbook -i ../inventory/hosts.yml deploy.yml --ask-vault-pass

          📚 Documentation: ../README.md
          🔧 Architecture: Hybrid (Nginx SSL + Traefik routing)

          🐳 Container Status:
          {% if container_status is defined %}{{ container_status.stdout }}{% else %}Container status check skipped{% endif %}
      tags: [always]

    - name: Save deployment timestamp
      ansible.builtin.copy:
        content: |
          Deployment completed: {{ ansible_date_time.iso8601 }}
          Deployed by: {{ ansible_user_id }}@{{ ansible_hostname }}
          Version: {{ app_image }}
        dest: "{{ app_deploy_path }}/.deployment_info"
        mode: "0644"
      tags: [always]
