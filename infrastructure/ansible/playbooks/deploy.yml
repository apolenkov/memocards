---
# =============================================================================
# PLAYBOOK: deploy.yml
# Fast deployment of new Memocards application version
# =============================================================================
#
# This playbook performs quick application-only deployment:
# - Pull latest Docker image
# - Recreate containers
# - Health check
#
# Usage:
#   ansible-playbook -i ../inventory/hosts.yml deploy.yml --ask-vault-pass
#
# With specific version:
#   ansible-playbook -i ../inventory/hosts.yml deploy.yml --ask-vault-pass \
#     --extra-vars "app_image=ghcr.io/apolenkov/memocards:0.1"
#
# With specific commit (from CI/CD):
#   ansible-playbook -i ../inventory/hosts.yml deploy.yml --ask-vault-pass \
#     --extra-vars "app_image=ghcr.io/apolenkov/memocards:abc1234"
# =============================================================================

- name: Deploy Memocards Application Update
  hosts: vps
  become: true
  gather_facts: false

  vars_files:
    - ../secrets.yml

  tasks:
    # Normalize app_image: add :latest if no tag specified
    - name: Normalize app_image format
      ansible.builtin.set_fact:
        app_image_normalized: "{{ app_image | default('ghcr.io/apolenkov/memocards') }}"

    - name: Check if app_image has tag
      ansible.builtin.set_fact:
        app_image_has_tag: "{{ app_image_normalized | regex_search(':') is not none }}"

    - name: Add :latest tag if missing
      ansible.builtin.set_fact:
        app_image: "{{ app_image_normalized + ':latest' }}"
      when: not app_image_has_tag | default(false)

    - name: Use app_image as-is if tag present
      ansible.builtin.set_fact:
        app_image: "{{ app_image_normalized }}"
      when: app_image_has_tag | default(false)

    - name: Display deployment information
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║         Memocards Application Deployment Starting...      ║
          ╚════════════════════════════════════════════════════════════╝

          🎯 Target: {{ inventory_hostname }}
          🐳 Image: {{ app_image }}
          🌐 Domain: {{ domain }}
      tags: [always]

    - name: Validate deployment configuration
      ansible.builtin.assert:
        that:
          - app_image is defined
          - app_image != ""
          - app_image is string
          - "'ghcr.io' in app_image"
          - "':' in app_image"
        fail_msg: |
          ❌ INVALID DEPLOYMENT CONFIGURATION!

          app_image: {{ app_image | default('UNDEFINED') }}

          Requirements:
          - Must be defined and non-empty
          - Must contain 'ghcr.io' registry
          - Must have tag (format: image:tag)

          Expected formats:
          - ghcr.io/apolenkov/memocards:latest (default)
          - ghcr.io/apolenkov/memocards:1.0.0 (version)
          - ghcr.io/apolenkov/memocards:abc1234 (commit SHA)

        success_msg: "✅ Deployment configuration validated: {{ app_image }}"
      tags: [always, deploy]

    # =============================================================================
    # Pre-deployment checks - Verify system readiness before deployment
    # =============================================================================
    - name: Pre-deployment checks
      tags: [deploy, preflight]
      block:
        - name: Check disk space
          ansible.builtin.command: df -BG /opt
          register: disk_space_check
          changed_when: false

        - name: Parse available disk space
          ansible.builtin.set_fact:
            available_space_gb: "{{ (disk_space_check.stdout_lines | last).split()[3] | regex_replace('G', '') | int }}"

        - name: Fail if disk space < 5GB
          ansible.builtin.fail:
            msg: |
              ❌ Insufficient disk space!
              Available: {{ available_space_gb }} GB
              Required: 5 GB minimum

              Please free up disk space before deploying.
          when: available_space_gb | int < 5

        - name: Check if Docker daemon is running
          ansible.builtin.command: docker info
          register: docker_status
          changed_when: false
          failed_when: false

        - name: Fail if Docker is not running
          ansible.builtin.fail:
            msg: "❌ Docker daemon is not running. Please start Docker service."
          when: docker_status.rc != 0

        - name: Display pre-deployment summary
          ansible.builtin.debug:
            msg: |
              ╔════════════════════════════════════════╗
              ║   Pre-Deployment Checks - PASSED      ║
              ╚════════════════════════════════════════╝

              ✅ Disk space: {{ available_space_gb }} GB available
              ✅ Docker daemon: Running

              Ready to deploy: {{ app_image }}

    - name: Update Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../docker-compose.yml"
        dest: "{{ app_deploy_path }}/docker-compose.yml"
        mode: "0644"
      tags: [deploy, config]

    - name: Update production environment file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/app/templates/env.prod.j2"
        dest: "{{ app_deploy_path }}/.env"
        mode: "0600"
        backup: true
      tags: [deploy, config]

    # =============================================================================
    # Deployment with automatic rollback on failure
    # =============================================================================
    - name: Deploy application with rollback capability
      tags: [deploy]
      block:
        # Save current state for potential rollback
        - name: Get current running image
          ansible.builtin.command:
            cmd: >
              docker inspect memocards-app-prod
              --format {% raw %}{{.Config.Image}}{% endraw %}
          register: current_image_backup
          failed_when: false
          changed_when: false

        - name: Pull latest application image
          community.docker.docker_image_pull:
            name: "{{ app_image }}"
          register: pull_result

        - name: Clean up stopped containers (fixes cAdvisor duplicates)
          ansible.builtin.command:
            cmd: docker container prune -f
          register: container_cleanup
          changed_when: "'Total reclaimed space' in container_cleanup.stdout or 'No space reclaimed' not in container_cleanup.stdout"
          failed_when: false

        - name: Display container cleanup results
          ansible.builtin.debug:
            msg: "🧹 Container cleanup: {{ container_cleanup.stdout | default('No stopped containers found') }}"
          when: container_cleanup.stdout is defined

        - name: Deploy application services
          ansible.builtin.command:
            cmd: docker compose -p memocards-prod -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.prod.yml --profile prod up -d
              --pull always --remove-orphans
            chdir: "{{ app_deploy_path }}"
          register: compose_result
          changed_when: >-
            'Created' in compose_result.stdout or
            'Started' in compose_result.stdout or
            'Recreated' in compose_result.stdout or
            'Pulled' in compose_result.stdout
 # NOTE: Recreates containers if config/images changed

        - name: Get list of memocards images
          ansible.builtin.command:
            cmd: >
              docker images ghcr.io/apolenkov/memocards
              --format {% raw %}{{.ID}}|{{.Tag}}{% endraw %}
          register: docker_images_list
          changed_when: false

        - name: Parse and sort images
          ansible.builtin.set_fact:
            sorted_images: "{{ docker_images_list.stdout_lines | default([]) }}"
          when: docker_images_list.stdout_lines | length > 0

        - name: Remove old images (keep 3 most recent)
          ansible.builtin.command: docker rmi -f {{ item.split('|')[0] }}
          loop: "{{ sorted_images[:-3] | default([]) }}"
          when: sorted_images | length > 3
          register: cleanup_result
          failed_when: cleanup_result.rc not in [0, 1]
          changed_when: cleanup_result.rc == 0

        - name: Log cleanup results
          ansible.builtin.debug:
            msg: |
              Docker image cleanup completed:
              - Total images: {{ sorted_images | length }}
              - Kept: 3 most recent
              - Removed: {{ sorted_images[:-3] | length if sorted_images | length > 3 else 0 }} old images
          when: sorted_images | length > 3

        - name: Wait for PostgreSQL to be healthy
          ansible.builtin.command:
            cmd: docker inspect --format='{% raw %}{{.State.Health.Status}}{% endraw %}' memocards-postgres-prod
          register: postgres_health
          retries: 30
          delay: 2
          until: postgres_health.stdout == "healthy"
          changed_when: false

        - name: Wait for container to be running (not restarting)
          ansible.builtin.command:
            cmd: docker inspect --format='{% raw %}{{.State.Status}}{% endraw %}' memocards-app-prod
          register: container_status_raw
          retries: 20
          delay: 3
          until: container_status_raw.stdout == "running"
          changed_when: false
          failed_when: false

        - name: Fail if container is restarting
          ansible.builtin.fail:
            msg: |
              ❌ Container is in restart loop!

              Container status: {{ container_status_raw.stdout }}

              This usually indicates:
              - Application startup error
              - Configuration issue
              - Database connectivity problem
              - Memory/resource limits exceeded

              Check logs: docker logs memocards-app-prod
          when: container_status_raw.stdout != "running" and container_status_raw.rc == 0

        - name: Check container status before health check
          ansible.builtin.command:
            cmd: >-
              docker inspect --format='{% raw %}Status: {{.State.Status}},
              Health: {{.State.Health.Status}}, ExitCode: {{.State.ExitCode}},
              RestartCount: {{.RestartCount}}{% endraw %}' memocards-app-prod
          register: container_status_check
          changed_when: false
          failed_when: false

        - name: Display container status
          ansible.builtin.debug:
            msg: |
              📊 Container Status: {{ container_status_check.stdout }}

              Checking if container is running and healthy...

        - name: Check application logs (last 50 lines)
          ansible.builtin.command:
            cmd: docker logs --tail 50 memocards-app-prod 2>&1 || echo "Could not retrieve logs"
          register: app_logs
          changed_when: false
          failed_when: false
          when: container_status_check.rc == 0

        - name: Display application logs if container exists
          ansible.builtin.debug:
            msg: |
              📋 Application Logs (last 50 lines):
              {{ app_logs.stdout_lines | default(['No logs available']) | join('\n') }}
          when: container_status_check.rc == 0 and app_logs.stdout is defined

        - name: Wait for application container to be healthy (Docker health check)
          ansible.builtin.command:
            cmd: docker inspect --format='{% raw %}{{.State.Health.Status}}{% endraw %}' memocards-app-prod
          register: docker_health_status
          retries: 60
          delay: 5
          until: docker_health_status.stdout == "healthy"
          changed_when: false
          failed_when: false

        - name: Wait for Traefik to be ready (required for HTTP health check)
          ansible.builtin.uri:
            url: "http://localhost:{{ app_port }}"
            method: GET
            status_code: [200, 404, 503]  # Accept various status codes, just check if Traefik responds
            timeout: 5
            headers:
              Host: "{{ domain }}"
          retries: 10
          delay: 2
          register: traefik_check
          failed_when: false
          changed_when: false
          # Note: Traefik must be running for HTTP health check to work

        - name: Wait for application to be ready (HTTP check via Traefik)
          ansible.builtin.uri:
            url: "http://localhost:{{ app_port }}/actuator/health"
            method: GET
            status_code: 200
            timeout: 10
            return_content: true
            headers:
              Host: "{{ domain }}"
          retries: 30
          delay: 2
          register: http_health
          until: http_health.status == 200
          failed_when: false # Don't fail immediately, show diagnostics first
          # Note: HTTP check requires Host header for Traefik routing (Host rule in docker-compose.yml)

        - name: Show health check diagnostics
          ansible.builtin.debug:
            msg: |
              💚 Health Check Results:

              Docker Health Status: {{ docker_health_status.stdout | default('Unknown') }}
              Traefik Status: {{ 'READY ✅' if (traefik_check is defined and traefik_check.status in [200, 404, 503]) else 'NOT READY ⚠️' }}
              HTTP Health Status: {{ http_health.status | default('N/A') }}
              HTTP Response: {{ http_health.content | default('N/A') | truncate(500) }}

              Container Status: {{ container_status_check.stdout | default('Unknown') }}

              Note: Docker health check is the primary check. HTTP check requires Traefik to be running and Host header to match Traefik routing rules.

        - name: Fail if Docker health check not passed
          ansible.builtin.fail:
            msg: |
              ❌ APPLICATION DOCKER HEALTH CHECK FAILED!

              The application container did not become healthy after 60 retries (5 minutes).

              Docker Health Status: {{ docker_health_status.stdout | default('Unknown') }}
              Container Status: {{ container_status_check.stdout | default('Unknown') }}

              Please check:
              1. Application logs: docker logs memocards-app-prod
              2. Container status: docker ps -a | grep memocards-app-prod
              3. Docker health details: docker inspect memocards-app-prod | grep -A 20 Health
              4. Database connectivity: docker logs memocards-postgres-prod
          when: docker_health_status.stdout != "healthy"

      # Rollback procedure if deployment fails
      rescue:
        - name: Log deployment failure
          ansible.builtin.debug:
            msg: |
              ╔════════════════════════════════════════════╗
              ║        ⚠️  DEPLOYMENT FAILED ⚠️            ║
              ║    Initiating Automatic Rollback...        ║
              ╚════════════════════════════════════════════╝

        - name: Rollback to previous image
          ansible.builtin.command:
            cmd: docker compose -p memocards-prod -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.prod.yml --profile prod up -d
              --remove-orphans --force-recreate
            chdir: "{{ app_deploy_path }}"
          register: rollback_result
          changed_when: >-
            'Created' in rollback_result.stdout or
            'Started' in rollback_result.stdout or
            'Recreated' in rollback_result.stdout
          when: current_image_backup.stdout != ""

        - name: Wait for rollback Docker health check
          ansible.builtin.command:
            cmd: docker inspect --format='{% raw %}{{.State.Health.Status}}{% endraw %}' memocards-app-prod
          register: rollback_docker_health
          retries: 30
          delay: 5
          until: rollback_docker_health.stdout == "healthy"
          changed_when: false
          failed_when: false

        - name: Wait for rollback HTTP health check (optional)
          ansible.builtin.uri:
            url: "http://localhost:{{ app_port }}/actuator/health"
            method: GET
            status_code: 200
            headers:
              Host: "{{ domain }}"
            retries: 10
            delay: 2
            register: rollback_http_health
            failed_when: false

        - name: Fail playbook after rollback attempt
          ansible.builtin.fail:
            msg: |
              Deployment failed and rollback
              {{ 'completed' if (rollback_docker_health.stdout == 'healthy'
              or rollback_http_health.status == 200) else 'FAILED' }}.

              Docker Health: {{ rollback_docker_health.stdout | default('Unknown') }}
              HTTP Health: {{ rollback_http_health.status | default('N/A') }}

              Failed image: {{ app_image }}
              {% if rollback_docker_health.stdout == 'healthy' or rollback_http_health.status == 200 %}
              Restored image: {{ current_image_backup.stdout }}
              {% else %}
              MANUAL INTERVENTION REQUIRED!
              {% endif %}

              Check logs: docker logs memocards-app-prod

    # =============================================================================
    # Post-deployment verification - Verify all services are running
    # =============================================================================
    - name: Verify monitoring services
      tags: [verify]
      block:
        - name: Wait for Grafana to be ready
          ansible.builtin.shell: |
            for i in {1..30}; do
              if docker exec memocards-grafana-prod curl -f http://localhost:3000/api/health 2>/dev/null; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          register: grafana_health_check
          changed_when: false
          failed_when: false
          when: grafana_enabled

        - name: Display monitoring verification results
          ansible.builtin.debug:
            msg: |
              📊 Monitoring Services Verification:
              - Grafana: {%
                if grafana_enabled and grafana_health_check is defined
              %}{{ grafana_health_check.rc == 0 | ternary('READY ✅', 'NOT READY ⚠️') }}{%
                elif grafana_enabled
              %}DISABLED{%
                else
              %}DISABLED{%
                endif
              %}

    - name: Get application version info
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/actuator/info"
        method: GET
        return_content: true
        headers:
          Host: "{{ domain }}"
      register: app_info
      failed_when: false
      tags: [deploy, verify]

    - name: Display deployment status
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║      🚀 Application Deployed Successfully!                ║
          ╚════════════════════════════════════════════════════════════╝

          ✅ Status:
          - Image pulled: {{ app_image }}
          - Containers recreated: ✅
          - Old images cleaned: ✅
          - Docker Health:
            {% if docker_health_status is defined
            %}{{ 'HEALTHY ✅' if docker_health_status.stdout == 'healthy'
            else docker_health_status.stdout | default('UNKNOWN ⚠️')
            }}{% else %}NOT CHECKED ⏭️{% endif %}
          - HTTP Health:
            {% if http_health is defined
            %}{{ 'PASSED ✅' if http_health.status == 200
            else 'FAILED ❌ (may be blocked by Vaadin)'
            }}{% else %}NOT RUN ⏭️{% endif %}
          - PostgreSQL: {% if postgres_health is defined %}{{ postgres_health.stdout }}{% else %}NOT CHECKED ⏭️{% endif %}

          🌐 Access:
          - URL: https://{{ domain }}
          - Health: https://{{ domain }}/actuator/health

          📋 Verify:
          - Check application: curl https://{{ domain }}
          - View logs: docker logs -f memocards-app-prod
          - Check metrics: curl http://localhost:{{ app_port }}/actuator/metrics
      tags: [always]

    # =============================================================================
    # Deployment History - Structured logging for tracking
    # =============================================================================
    - name: Create deployments history directory
      ansible.builtin.file:
        path: "{{ app_deploy_path }}/deployments"
        state: directory
        mode: "0755"
      tags: [always, history]

    - name: Get remote user info
      ansible.builtin.command: whoami
      register: remote_user_info
      changed_when: false
      tags: [always, history]

    - name: Generate deployment metadata
      ansible.builtin.set_fact:
        deployment_metadata:
          timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          epoch: "{{ lookup('pipe', 'date +%s') }}"
          image: "{{ app_image }}"
          deployed_by: "{{ remote_user_info.stdout }}@{{ inventory_hostname }}"
          deployment_method: "ansible"
          status: "success"
          health_check:
            postgres: "{{ postgres_health.stdout | default('unknown') if postgres_health is defined else 'unknown' }}"
            docker_health: "{{ docker_health_status.stdout | default('unknown') if docker_health_status is defined else 'unknown' }}"
            http_health: "{{ 'healthy' if (http_health is defined and http_health.status == 200) else 'failed' if http_health is defined else 'unknown' }}"
          version_info: "{{ app_info.json | default({}) }}"
      tags: [always, history]

    - name: Save deployment history (JSON)
      ansible.builtin.copy:
        content: "{{ deployment_metadata | to_nice_json }}"
        dest: "{{ app_deploy_path }}/deployments/{{ deployment_metadata.epoch }}.json"
        mode: "0644"
      tags: [always, history]

    - name: Update latest deployment symlink
      ansible.builtin.file:
        src: "{{ app_deploy_path }}/deployments/{{ deployment_metadata.epoch }}.json"
        dest: "{{ app_deploy_path }}/deployments/latest.json"
        state: link
        force: true
      tags: [always, history]

    - name: Get recent deployments count
      ansible.builtin.find:
        paths: "{{ app_deploy_path }}/deployments"
        patterns: "*.json"
        excludes: "latest.json"
      register: deployment_files
      tags: [always, history]

    - name: Cleanup old deployment logs (keep last 50)
      ansible.builtin.shell: |
        cd {{ app_deploy_path }}/deployments
        set -o pipefail
        ls -1t *.json | grep -v latest.json | tail -n +51 | xargs -r rm -f
      args:
        executable: /bin/bash
      when: deployment_files.matched > 50
      changed_when: false
      tags: [always, history, cleanup]

    - name: Display deployment history summary
      ansible.builtin.debug:
        msg: |
          📊 Deployment History:
          - Current deployment: {{ deployment_metadata.timestamp }}
          - Total deployments: {{ deployment_files.matched }}
          - History location: {{ app_deploy_path }}/deployments/
          - Latest: {{ app_deploy_path }}/deployments/latest.json
      tags: [always, history]
