---
# =============================================================================
# Monitoring Role - Deploy Infrastructure (Prometheus, Loki, Promtail, Grafana)
# =============================================================================

- name: Create infrastructure directories on server
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ app_deploy_path }}/infrastructure/grafana"
    - "{{ app_deploy_path }}/infrastructure/grafana/config"
    - "{{ app_deploy_path }}/infrastructure/grafana/dashboards"
    - "{{ app_deploy_path }}/infrastructure/grafana/provisioning"
    - "{{ app_deploy_path }}/infrastructure/grafana/provisioning/datasources"
    - "{{ app_deploy_path }}/infrastructure/prometheus"
    - "{{ app_deploy_path }}/infrastructure/promtail"
    - "{{ app_deploy_path }}/infrastructure/traefik"
    - "{{ app_deploy_path }}/infrastructure/traefik/dynamic"
    - "{{ app_deploy_path }}/infrastructure/loki"
    - "{{ app_deploy_path }}/infrastructure/alertmanager"
  tags: [monitoring, config]

- name: Write Traefik .htpasswd from pre-hashed Vault line (preferred)
  ansible.builtin.copy:
    dest: "{{ app_deploy_path }}/infrastructure/traefik/.htpasswd"
    mode: "0644"
    content: |
      {{ monitoring_basicauth_user }}:{{ monitoring_basicauth_htpasswd }}
  when: monitoring_basicauth_htpasswd is defined and monitoring_basicauth_htpasswd | length > 0
  tags: [monitoring, config]

- name: Generate Traefik .htpasswd with bcrypt when only user/password provided
  ansible.builtin.shell: |
    set -euo pipefail
    which htpasswd >/dev/null 2>&1 || \
      (apt-get update -y && apt-get install -y apache2-utils)
    htpasswd -nbB '{{ monitoring_basicauth_user }}' \
      '{{ monitoring_basicauth_password }}' > \
      "{{ app_deploy_path }}/infrastructure/traefik/.htpasswd"
    chmod 0644 "{{ app_deploy_path }}/infrastructure/traefik/.htpasswd"
  args:
    executable: /bin/bash
  when: >-
    monitoring_basicauth_htpasswd is not defined and
    (monitoring_basicauth_user is defined and
     monitoring_basicauth_password is defined)
  changed_when: true
  tags: [monitoring, config]

- name: Copy Grafana configuration files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/grafana/{{ item }}"
    dest: "{{ app_deploy_path }}/infrastructure/grafana/{{ item }}"
    mode: "0644"
  loop:
    - "config/grafana.ini"
    - "dashboards/dashboard-memocards.json"
    - "provisioning/dashboards/dashboards.yml"
  tags: [monitoring, config, grafana]
  # Ansible automatically skips unchanged files using checksums (default behavior, no need to specify)

- name: Create Grafana datasources from template
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/monitoring/templates/grafana-datasources.yml.j2"
    dest: "{{ app_deploy_path }}/infrastructure/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  tags: [monitoring, config, grafana]

- name: Copy Prometheus configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/prometheus/prometheus.yml"
    dest: "{{ app_deploy_path }}/infrastructure/prometheus/prometheus.yml"
    mode: "0644"
  tags: [monitoring, config, prometheus]

- name: Copy Prometheus alerting rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/prometheus/alerts.yml"
    dest: "{{ app_deploy_path }}/infrastructure/prometheus/alerts.yml"
    mode: "0644"
  tags: [monitoring, config, prometheus]

- name: Copy Promtail configuration file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/promtail/promtail.yml"
    dest: "{{ app_deploy_path }}/infrastructure/promtail/promtail.yml"
    mode: "0644"
  tags: [monitoring, config, promtail]

- name: Copy Traefik static configuration files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/traefik/{{ item }}"
    dest: "{{ app_deploy_path }}/infrastructure/traefik/{{ item }}"
    mode: "0644"
  loop:
    - "traefik.yml"
  tags: [monitoring, config, traefik]

# Traefik dashboard routing is now configured via Docker labels in docker-compose.infrastructure.yml
# No file provider needed - removed to simplify configuration

- name: Copy Loki configuration file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/loki/loki.yml"
    dest: "{{ app_deploy_path }}/infrastructure/loki/loki.yml"
    mode: "0644"
  tags: [monitoring, config, loki]

- name: Copy Alertmanager configuration file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../infrastructure/alertmanager/alertmanager.yml"
    dest: "{{ app_deploy_path }}/infrastructure/alertmanager/alertmanager.yml"
    mode: "0644"
  tags: [monitoring, config, alertmanager]

- name: Ensure memocards-internal network exists (required for infrastructure)
  ansible.builtin.shell: |
    docker network inspect memocards-internal >/dev/null 2>&1 || \
      docker network create --driver bridge --subnet 172.20.0.0/16 memocards-internal
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  tags: [monitoring, config]

- name: Copy Docker Compose configuration (infrastructure)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../docker-compose.infrastructure.yml"
    dest: "{{ app_deploy_path }}/docker-compose.infrastructure.yml"
    mode: "0644"
  tags: [monitoring, config]

# NOTE: Avoid full downtime; do not call compose down. We'll update services in-place below.

- name: Deploy infrastructure services (all services with prod profile)
  ansible.builtin.command:
    cmd: >-
      docker compose -p memocards-prod
      -f docker-compose.yml
      -f docker-compose.infrastructure.yml
      -f docker-compose.prod.yml
      --profile prod
      up -d --pull always --remove-orphans --force-recreate
    chdir: "{{ app_deploy_path }}"
  register: monitoring_infrastructure_compose_result
  changed_when: >-
    'Created' in monitoring_infrastructure_compose_result.stdout or
    'Started' in monitoring_infrastructure_compose_result.stdout or
    'Recreated' in monitoring_infrastructure_compose_result.stdout or
    'Pulled' in monitoring_infrastructure_compose_result.stdout or
    monitoring_infrastructure_compose_result.rc == 0
  failed_when: >-
    monitoring_infrastructure_compose_result.rc != 0 and
    'Conflict' not in monitoring_infrastructure_compose_result.stderr and
    'already in use' not in monitoring_infrastructure_compose_result.stderr
  tags: [monitoring, deploy]

- name: Wait for Docker Socket Proxy to be ready (after deployment)
  ansible.builtin.uri:
    url: "http://localhost:2375/_ping"
    method: GET
    status_code: 200
    timeout: 5
  register: monitoring_docker_socket_proxy_health
  until: monitoring_docker_socket_proxy_health.status == 200
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  tags: [monitoring, verify, healthcheck]
  when: "'quick' not in ansible_run_tags"

- name: Wait for Grafana to be ready (after deployment)
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    method: GET
    status_code: 200
    timeout: 5
  register: monitoring_grafana_health
  until: monitoring_grafana_health.status == 200
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  tags: [monitoring, verify, healthcheck]
  when: "'quick' not in ansible_run_tags"

- name: Wait for Traefik to be ready (check routing)
  # In Traefik v3.0 with insecure=false, API is not directly accessible
  # Check that Traefik responds on port 8080 (even 404 means it's working)
  ansible.builtin.uri:
    url: "http://localhost:8080/"
    method: GET
    status_code: [200, 404]  # 404 is OK - means Traefik is running and routing
    timeout: 5
  register: monitoring_traefik_health_check
  until: monitoring_traefik_health_check.status in [200, 404]
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  tags: [monitoring, verify, healthcheck]
  when: "'quick' not in ansible_run_tags"

- name: Wait for Grafana/Prometheus/Traefik routes to register in Traefik
  # Routes require Host header matching rule (Host(memocards.duckdns.org))
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    headers:
      Host: "{{ domain }}"
    status_code: "{{ item.expected_status }}"
    timeout: 5
  register: monitoring_route_check
  until: monitoring_route_check.status == item.expected_status
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  loop:
    - { url: "http://localhost:8080/grafana/", expected_status: [200, 301, 302] }
    - { url: "http://localhost:8080/prometheus/", expected_status: [401, 403] }
    - { url: "http://localhost:8080/alertmanager/", expected_status: [401, 403] }
    - { url: "http://localhost:8080/traefik/", expected_status: [401, 403, 404] }
  tags: [monitoring, verify, healthcheck]
  when: "'quick' not in ansible_run_tags"

- name: Display monitoring status
  ansible.builtin.debug:
    msg: |
      ✅ Infrastructure deployed:

      🔄 Traefik:
        {% if monitoring_traefik_health_check is defined
        and monitoring_traefik_health_check.rc is defined
        and monitoring_traefik_health_check.rc == 0 %}READY ✅
        {% else %}STARTING...{% endif %}
      🔒 Docker Socket Proxy: running (security layer)
      📊 Prometheus: localhost:9090
      🚨 Alertmanager: localhost:9093
      📋 Loki: localhost:3100
      📝 Promtail: running
      📈 Grafana: localhost:3000

      🌐 External Access (via Nginx → Traefik):
      - Application: https://{{ domain }}
      - Grafana: https://{{ domain }}/grafana
      - Prometheus: https://{{ domain }}/prometheus
      - Alertmanager: https://{{ domain }}/alertmanager
      - Traefik Dashboard: https://{{ domain }}/traefik/dashboard/

      🔗 Direct Access via SSH tunnel:
      - ssh -L 9090:localhost:9090 root@{{ ansible_host }} (Prometheus)
      - ssh -L 9093:localhost:9093 root@{{ ansible_host }} (Alertmanager)
      - ssh -L 3000:localhost:3000 root@{{ ansible_host }} (Grafana)
      - ssh -L 8080:localhost:8080 root@{{ ansible_host }} (Traefik API)
      - ssh -L 2375:localhost:2375 root@{{ ansible_host }} (Docker Socket Proxy)
  tags: [monitoring]
