auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1  # For single-instance deployment
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor

limits_config:
  retention_period: 720h  # 30 days
  max_query_parallelism: 64  # Increased from 32 to handle concurrent Grafana queries
  max_query_series: 100000
  allow_structured_metadata: false
  # Query timeout
  query_timeout: 300s  # 5 minutes
  # Per-tenant limits
  max_query_length: 721h  # 30 days + 1 hour buffer
  max_query_lookback: 721h  # 30 days + 1 hour buffer
  # Increase concurrent query limits to prevent "too many outstanding requests" (429)
  # Default max_query_parallelism (32) is often too low for Grafana dashboards with multiple panels
  # Increased to 64 to handle concurrent queries from Grafana
  # Query throughput limits for log ingestion
  ingestion_rate_mb: 16  # Maximum ingestion rate (16 MB/s)
  ingestion_burst_size_mb: 32  # Burst size for ingestion (32 MB)

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # 30 days
