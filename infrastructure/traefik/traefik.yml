# EntryPoints - Internal routing entrypoint
# Nginx on host handles 80/443 (external traffic, SSL termination)
entryPoints:
  web:
    address: ":8080"
    # Main entrypoint for internal routing (Nginx proxies all traffic here)

api:
  dashboard: true
  insecure: false  # Secure mode - use Docker labels for routing with basic auth
  debug: false  # Enable debug mode via environment variable TRAEFIK_DEBUG=true if needed
  # Note: api@internal service works only on explicit routes, not on redirect middleware

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: memocards-internal
    # Filter containers by Docker Compose project label
    # This improves performance by only processing relevant containers
    # Project name is set via -p memocards-prod in Ansible deployment
    constraints: "Label(`com.docker.compose.project`, `memocards-prod`)"

log:
  level: INFO

accessLog: {}

