---
# Application services (PostgreSQL + App)
# This compose file creates the 'memocards-internal' network that infrastructure uses
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-memocards-postgres}
    profiles:
      - dev
      - prod
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-memocards}
      POSTGRES_USER: ${DB_USER:-memocards_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---auth-host=scram-sha-256}
    # Port mapping: removed from base config for security
    # Ports are added only in docker-compose.dev.yml for local development
    # In production: no port mapping (accessible only via Docker network)
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-memocards_user} -d ${DB_NAME:-memocards}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${POSTGRES_HEALTHCHECK_START:-30s}
    stop_grace_period: 30s  # Graceful shutdown for PostgreSQL
    restart: unless-stopped
    networks:
      - internal

  app:
    image: ${APP_IMAGE:-ghcr.io/apolenkov/memocards:${APP_VERSION:-latest}}
    # Container name: use APP_CONTAINER_NAME for production, omit for development
    # Omitting allows Docker Compose to auto-generate names (project_app_1)
    # This enables running multiple versions simultaneously
    container_name: ${APP_CONTAINER_NAME}
    profiles:
      - dev
      - prod
    user: "1000:1000"
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    env_file:
      - .env
    environment:
      # Override Vaadin settings for containers
      VAADIN_LAUNCH_BROWSER: false
      VAADIN_PRODUCTION_MODE: true
      # Override database URL for Docker networking
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-memocards}
      # Override logging path for Docker container (maps to /app/logs in container)
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - ${APP_LOGS_PATH:-./logs}:/app/logs
    mem_limit: ${APP_MEMORY_LIMIT:-1500m}
    cpus: ${APP_CPUS:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # No external port publication for 8080: served via Traefik on the same Docker network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${APP_HEALTHCHECK_START:-60s}
    stop_grace_period: 30s  # Graceful shutdown for Spring Boot application
    networks:
      internal:
        aliases:
          - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN:-example.com}`) && !PathPrefix(`/grafana`) && !PathPrefix(`/prometheus`) && !PathPrefix(`/traefik`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
      - "traefik.http.routers.app.priority=1"
      # Security headers middleware
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secure-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.routers.app.middlewares=secure-headers"

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    name: memocards-internal
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}
