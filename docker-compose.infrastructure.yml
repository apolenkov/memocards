---
# Infrastructure monitoring services (Prometheus, Loki, Promtail, Grafana, Traefik)
# NOTE: Requires docker-compose.yml to be started first to create the network
# Usage: docker compose -f docker-compose.infrastructure.yml up -d

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.0}
    container_name: ${TRAEFIK_CONTAINER_NAME:-memocards-traefik}
    profiles:
      - prod
    ports:
      # Main entrypoint for Nginx proxy (all traffic from Nginx goes here)
      - "127.0.0.1:8080:8080"
      # Dashboard API entrypoint (for direct localhost access)
      - "127.0.0.1:8081:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic
      - ./infrastructure/traefik/.htpasswd:/etc/traefik/.htpasswd:ro
      # ACME volume not needed - Nginx handles SSL certificates
    restart: unless-stopped
    mem_limit: 128m
    cpus: ${TRAEFIK_CPUS:-0.25}
    networks:
      - internal
    labels:
      # Traefik dashboard accessible via /traefik/ path
      - "traefik.enable=true"
      # Router for /traefik/ - catch-all for dashboard and API
      # Use api@internal service (special Traefik service for API/dashboard)
      - "traefik.http.routers.traefik.rule=Host(`memocards.duckdns.org`) && PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.priority=10"
      - "traefik.http.routers.traefik.service=api@internal"
      # Traefik API/dashboard is accessible at /traefik/ via routing rule above
      - "traefik.http.routers.traefik.middlewares=basicauth@docker"
      - "traefik.http.middlewares.basicauth.basicauth.usersfile=/etc/traefik/.htpasswd"
      # Redirect common typo /traefic -> /traefik/
      - "traefik.http.middlewares.traefic-redirect.redirectregex.regex=^/traefic/?(.*)"
      - "traefik.http.middlewares.traefic-redirect.redirectregex.replacement=/traefik/$1"
      - "traefik.http.routers.traefic-redirect.rule=PathPrefix(`/traefic`)"
      - "traefik.http.routers.traefic-redirect.entrypoints=web"
      - "traefik.http.routers.traefic-redirect.priority=20"
      - "traefik.http.routers.traefic-redirect.middlewares=traefic-redirect"
      - "traefik.http.routers.traefic-redirect.service=traefik"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    container_name: ${PROMETHEUS_CONTAINER_NAME:-memocards-prometheus}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=https://memocards.duckdns.org/prometheus/'
      - '--web.route-prefix=/'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: ${PROMETHEUS_CPUS:-0.5}
    networks:
      internal:
        aliases:
          - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`memocards.duckdns.org`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.priority=10"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix,basicauth@docker"
      - "traefik.http.middlewares.prometheus-stripprefix.stripprefix.prefixes=/prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.8}
    container_name: ${LOKI_CONTAINER_NAME:-memocards-loki}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m  # Increased from 192m to handle concurrent queries
    cpus: ${LOKI_CPUS:-1.0}  # Increased from 0.5 to handle concurrent queries
    networks:
      internal:
        aliases:
          - loki
    environment:
      - JAEGER_AGENT_HOST=localhost

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.8}
    container_name: ${PROMTAIL_CONTAINER_NAME:-memocards-promtail}
    profiles:
      - prod
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/promtail:/etc/promtail
      - promtail_positions:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    healthcheck:
      # Promtail health check: verify HTTP endpoint is accessible
      # Using simple HTTP check via /proc/net/tcp (available in all containers)
      # Promtail listens on port 9080 (hex: 2388, little-endian: 8823)
      test: ["CMD-SHELL", "grep -qE ':(2388|8823)' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s  # Increased to allow Promtail to discover Docker containers
    restart: unless-stopped
    mem_limit: 96m
    cpus: ${PROMTAIL_CPUS:-0.25}
    networks:
      internal:
        aliases:
          - promtail
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: ${GRAFANA_CONTAINER_NAME:-memocards-grafana}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://memocards.duckdns.org/grafana/}
      GF_SERVER_PROTOCOL: http
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard-memocards.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/grafana/config/grafana.ini:/etc/grafana/grafana.ini
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    mem_limit: 192m
    cpus: ${GRAFANA_CPUS:-0.5}
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`memocards.duckdns.org`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=10"
      # stripPrefix removes /grafana before forwarding to Grafana
      # Grafana with serve_from_sub_path=true expects requests WITHOUT /grafana prefix
      # Grafana uses root_url to generate correct URLs with /grafana prefix
      - "traefik.http.routers.grafana.middlewares=grafana-stripprefix,grafana-headers"
      - "traefik.http.middlewares.grafana-stripprefix.stripprefix.prefixes=/grafana"
      - "traefik.http.middlewares.grafana-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ${NODE_EXPORTER_CONTAINER_NAME:-memocards-node-exporter}
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      # Mount udev directory to fix "Failed to open directory /run/udev/data" warning
      - '/run/udev:/host/run/udev:ro'
    restart: unless-stopped
    profiles:
      - prod
    networks:
      internal:
        aliases:
          - node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ${CADVISOR_CONTAINER_NAME:-memocards-cadvisor}
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    restart: unless-stopped
    profiles:
      - prod
    networks:
      internal:
        aliases:
          - cadvisor


volumes:
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  promtail_positions:
    driver: local
  # traefik_acme removed - Nginx handles SSL on host

networks:
  internal:
    name: memocards-internal
    external: false

