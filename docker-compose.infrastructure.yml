---
# Infrastructure monitoring services (Prometheus, Loki, Promtail, Grafana, Traefik)
# NOTE: Requires docker-compose.yml to be started first to create the network
# Usage: docker compose -f docker-compose.infrastructure.yml up -d

services:
  # Docker Socket Proxy - Security layer for Prometheus and Promtail
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    container_name: ${DOCKER_SOCKET_PROXY_CONTAINER_NAME:-memocards-docker-socket-proxy}
    profiles:
      - prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow only necessary operations for Prometheus Service Discovery
      CONTAINERS: 1      # Read container information (required for Service Discovery)
      IMAGES: 0         # No access to images
      NETWORKS: 1       # Read network information (required for Service Discovery to get container IPs)
      VOLUMES: 0        # No access to volumes
      EXEC: 0           # No access to exec (no container control)
      EVENTS: 1         # Docker events (required for Service Discovery)
      PING: 1           # Health check
      AUTH: 0           # No access to auth
      BUILD: 0          # No access to build
      COMMIT: 0         # No access to commit
      CONFIG: 0         # No access to config
      DISTRIBUTION: 0   # No access to distribution
      INFO: 1           # Read-only system info (required for Service Discovery)
      SECRETS: 0        # No access to secrets
      SESSION: 0        # No access to session
      SWARM: 0          # No access to swarm
      SYSTEM: 0         # No access to system (except info)
      TASKS: 0          # No access to tasks
      VERSION: 1        # Read-only version info (required for Service Discovery)
    restart: unless-stopped
    mem_limit: 32m
    cpus: ${DOCKER_SOCKET_PROXY_CPUS:-0.1}
    networks:
      internal:
        aliases:
          - docker-socket-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2375/_ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.0}
    container_name: ${TRAEFIK_CONTAINER_NAME:-memocards-traefik}
    profiles:
      - prod
    ports:
      # Main entrypoint for Nginx proxy (all traffic from Nginx goes here)
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./infrastructure/traefik/.htpasswd:/etc/traefik/.htpasswd:ro
      # ACME volume not needed - Nginx handles SSL certificates
    stop_grace_period: 10s  # Graceful shutdown for Traefik
    restart: unless-stopped
    mem_limit: 128m
    cpus: ${TRAEFIK_CPUS:-0.25}
    networks:
      - internal
    labels:
      # Traefik dashboard routing via Docker labels
      # Note: In Traefik v3.0, basePath is not supported - routing must be explicit via PathPrefix
      # API endpoints: /api/*, Dashboard: /dashboard/*
      # We need to route /traefik/api and /traefik/dashboard to api@internal
      - "traefik.enable=true"
      # API router for /traefik/api/* - needs stripprefix to remove /traefik
      # Note: api@internal expects /api/* paths, so /traefik/api -> /api
      - "traefik.http.routers.traefik-api-prefixed.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/traefik/api`)"
      - "traefik.http.routers.traefik-api-prefixed.entrypoints=web"
      - "traefik.http.routers.traefik-api-prefixed.priority=10"
      - "traefik.http.routers.traefik-api-prefixed.service=api@internal"
      - "traefik.http.routers.traefik-api-prefixed.middlewares=traefik-api-stripprefix,traefik-basicauth"
      - "traefik.http.middlewares.traefik-api-stripprefix.stripprefix.prefixes=/traefik"
      # API router for /api/* - direct path, no stripprefix needed
      # Dashboard JS client makes requests to /api/* (relative from /traefik/dashboard/)
      - "traefik.http.routers.traefik-api-direct.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-api-direct.entrypoints=web"
      - "traefik.http.routers.traefik-api-direct.priority=10"
      - "traefik.http.routers.traefik-api-direct.service=api@internal"
      - "traefik.http.routers.traefik-api-direct.middlewares=traefik-basicauth"
      # Dashboard router - routes /traefik/dashboard/* and static assets to api@internal with stripprefix
      # Dashboard serves HTML, JS, CSS, and other assets from /dashboard/* and /assets/*, /icons/*, etc.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN:-example.com}`) && (PathPrefix(`/traefik/dashboard`) || PathPrefix(`/traefik/assets`) || PathPrefix(`/traefik/icons`) || PathPrefix(`/traefik/app-logo`))"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.priority=10"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-stripprefix,traefik-basicauth"
      - "traefik.http.middlewares.traefik-dashboard-stripprefix.stripprefix.prefixes=/traefik"
      # Redirect /traefik/ to /traefik/dashboard/
      - "traefik.http.routers.traefik-redirect.rule=Host(`${DOMAIN:-example.com}`) && (Path(`/traefik`) || Path(`/traefik/`))"
      - "traefik.http.routers.traefik-redirect.entrypoints=web"
      - "traefik.http.routers.traefik-redirect.priority=20"
      - "traefik.http.routers.traefik-redirect.service=api@internal"
      - "traefik.http.routers.traefik-redirect.middlewares=traefik-redirect-to-dashboard"
      - "traefik.http.middlewares.traefik-redirect-to-dashboard.redirectregex.regex=^/traefik/?$"
      - "traefik.http.middlewares.traefik-redirect-to-dashboard.redirectregex.replacement=/traefik/dashboard/"
      - "traefik.http.middlewares.traefik-redirect-to-dashboard.redirectregex.permanent=true"
      # Shared middleware
      - "traefik.http.middlewares.traefik-basicauth.basicauth.usersfile=/etc/traefik/.htpasswd"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    container_name: ${PROMETHEUS_CONTAINER_NAME:-memocards-prometheus}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
      # Docker socket proxy for security (instead of direct Docker socket access)
      # No direct Docker socket mount - use docker-socket-proxy instead
    # Note: Prometheus requires write access to /prometheus for queries.active file
    # Using nobody:nobody (65534:65534) - ensure volume permissions are correct
    user: "65534:65534"  # nobody:nobody (non-root user for security)
    environment:
      # Use docker-socket-proxy instead of direct Docker socket
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=https://${DOMAIN:-example.com}/prometheus/'
      - '--web.route-prefix=/'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s  # Graceful shutdown for Prometheus
    restart: unless-stopped
    mem_limit: 512m  # Increased from 256m for 30d retention
    cpus: ${PROMETHEUS_CPUS:-0.5}
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.priority=10"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix,prometheus-basicauth"
      - "traefik.http.middlewares.prometheus-basicauth.basicauth.usersfile=/etc/traefik/.htpasswd"
      - "traefik.http.middlewares.prometheus-stripprefix.stripprefix.prefixes=/prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    container_name: ${ALERTMANAGER_CONTAINER_NAME:-memocards-alertmanager}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${DOMAIN:-example.com}/alertmanager/'
      - '--web.route-prefix=/'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s  # Graceful shutdown for Alertmanager
    restart: unless-stopped
    mem_limit: 128m
    cpus: ${ALERTMANAGER_CPUS:-0.25}
    networks:
      internal:
        aliases:
          - alertmanager
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/alertmanager`)"
      - "traefik.http.routers.alertmanager.entrypoints=web"
      - "traefik.http.routers.alertmanager.priority=10"
      - "traefik.http.routers.alertmanager.middlewares=alertmanager-stripprefix,alertmanager-basicauth"
      - "traefik.http.middlewares.alertmanager-basicauth.basicauth.usersfile=/etc/traefik/.htpasswd"
      - "traefik.http.middlewares.alertmanager-stripprefix.stripprefix.prefixes=/alertmanager"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.8}
    container_name: ${LOKI_CONTAINER_NAME:-memocards-loki}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s  # Graceful shutdown for Loki
    restart: unless-stopped
    mem_limit: 512m  # Increased from 192m to handle concurrent queries
    cpus: ${LOKI_CPUS:-1.0}  # Increased from 0.5 to handle concurrent queries
    networks:
      internal:
        aliases:
          - loki
    environment:
      - JAEGER_AGENT_HOST=localhost

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.8}
    container_name: ${PROMTAIL_CONTAINER_NAME:-memocards-promtail}
    profiles:
      - prod
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/promtail:/etc/promtail
      - promtail_positions:/var/lib/promtail
      # Docker socket proxy for security (instead of direct Docker socket access)
      # No direct Docker socket mount - use docker-socket-proxy instead
    environment:
      # Use docker-socket-proxy instead of direct Docker socket
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    command: -config.file=/etc/promtail/promtail.yml
    healthcheck:
      # Promtail doesn't have wget/curl/pgrep in minimal image, use /proc check instead
      # Promtail is working if process is running (logs show successful transfers to Loki)
      test: ["CMD-SHELL", "test -f /proc/1/cmdline && cat /proc/1/cmdline | grep -q promtail || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s  # Increased to allow Promtail to discover Docker containers
    restart: unless-stopped
    mem_limit: 96m
    cpus: ${PROMTAIL_CPUS:-0.25}
    networks:
      internal:
        aliases:
          - promtail
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_healthy

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: ${GRAFANA_CONTAINER_NAME:-memocards-grafana}
    profiles:
      - prod
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_DOMAIN: ${DOMAIN:-example.com}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN:-example.com}/grafana/}
      GF_SERVER_PROTOCOL: http
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard-memocards.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/grafana/config/grafana.ini:/etc/grafana/grafana.ini
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s  # Graceful shutdown for Grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    mem_limit: 192m
    cpus: ${GRAFANA_CPUS:-0.5}
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=10"
      # Note: stripPrefix removed - Grafana with serve_from_sub_path=true expects requests WITH /grafana prefix
      # Grafana handles the /grafana prefix internally based on root_url configuration
      - "traefik.http.routers.grafana.middlewares=grafana-headers"
      # Traefik automatically adds X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto headers
      # We only need to explicitly set X-Forwarded-Proto for HTTPS
      - "traefik.http.middlewares.grafana-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ${NODE_EXPORTER_CONTAINER_NAME:-memocards-node-exporter}
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      # Mount udev directory to fix "Failed to open directory /run/udev/data" warning
      - '/run/udev:/host/run/udev:ro'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: ${NODE_EXPORTER_CPUS:-0.1}
    profiles:
      - prod
    networks:
      internal:
        aliases:
          - node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ${CADVISOR_CONTAINER_NAME:-memocards-cadvisor}
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    command:
      # Filter to show only Docker containers (excludes system containers)
      - --docker_only=true
      # Store only last 2 minutes of data to reduce memory usage
      - --storage_duration=2m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: ${CADVISOR_CPUS:-0.25}
    profiles:
      - prod
    networks:
      internal:
        aliases:
          - cadvisor
    labels:
      # Note: Duplicate containers in cAdvisor dashboard may indicate:
      # 1. Multiple containers with same name from different compose projects
      # 2. Old stopped containers not cleaned up
      # 3. Containers restarted/recreated (cAdvisor shows both old and new)
      # Solution: Clean up old containers with: docker container prune -f
      - "traefik.enable=true"
      - "traefik.http.routers.cadvisor.rule=Host(`${DOMAIN:-example.com}`) && PathPrefix(`/cadvisor`)"
      - "traefik.http.routers.cadvisor.entrypoints=web"
      - "traefik.http.routers.cadvisor.priority=10"
      - "traefik.http.routers.cadvisor.middlewares=cadvisor-stripprefix"
      - "traefik.http.middlewares.cadvisor-stripprefix.stripprefix.prefixes=/cadvisor"
      - "traefik.http.services.cadvisor.loadbalancer.server.port=8080"


volumes:
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  promtail_positions:
    driver: local
  # traefik_acme removed - Nginx handles SSL on host

networks:
  internal:
    name: memocards-internal
    external: false

