services:
  app:
    profiles:
      - dev
    ports:
      - "127.0.0.1:8080:8080"
    # Remove Traefik labels in dev mode (direct port access)
    labels: []
    # Override container name to allow multiple dev instances
    container_name: ${APP_CONTAINER_NAME}

  postgres:
    profiles:
      - dev
    # Override ports: add port mapping for local development access
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

