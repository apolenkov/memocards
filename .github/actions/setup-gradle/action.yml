---
name: Setup Gradle Environment
description: Sets up Java, Gradle, and caching for builds

inputs:
  java-version:
    description: "Java version to use"
    required: false
    default: "21"
  distribution:
    description: "Java distribution to use"
    required: false
    default: "temurin"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        # Note: cache is handled by gradle/actions/setup-gradle below

    - name: Set up Node.js for Vaadin
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"

    - name: Setup Gradle with caching
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-read-only: false
        # Provides: dependency caching, build caching, build scan integration

    - name: Cache Vaadin frontend build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/vaadin-generated
          node_modules
        key: ${{ runner.os }}-vaadin-${{ hashFiles('**/package-lock.json', 'frontend/**') }}
        restore-keys: |
          ${{ runner.os }}-vaadin-

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Validate Gradle wrapper
      shell: bash
      run: |
        ./gradlew --version
        echo "✅ Gradle setup completed"
