---
name: Setup Gradle Environment
description: Sets up Java, Gradle, and caching for builds

inputs:
  java-version:
    description: "Java version to use"
    required: false
    default: "21"
  distribution:
    description: "Java distribution to use"
    required: false
    default: "temurin"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        # Note: cache is handled by gradle/actions/setup-gradle below

    - name: Setup Gradle with caching
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: false
        # Provides: dependency caching, build caching, build scan integration

    - name: Cache Vaadin frontend build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          build/vaadin-generated
          node_modules
        key: ${{ runner.os }}-vaadin-${{ hashFiles('**/package-lock.json', 'frontend/**') }}
        restore-keys: |
          ${{ runner.os }}-vaadin-

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Validate Gradle wrapper
      shell: bash
      run: |
        ./gradlew --version
        echo "✅ Gradle setup completed"
