---
name: Run Code Quality Checks
description: Runs Spotless, Checkstyle, PMD, SpotBugs, SonarLint, and CSS linting

inputs:
  gradle-opts:
    description: "Gradle JVM options"
    required: false
    default: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

runs:
  using: composite
  steps:
    - name: Cache npm dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Run static analysis and CSS linting
      shell: bash
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
      run: ./gradlew spotlessCheck codeQuality lintCss verifyJibFrontend
