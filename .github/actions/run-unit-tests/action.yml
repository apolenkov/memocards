---
name: Run Unit Tests
description: Runs unit tests and uploads results and coverage reports

inputs:
  gradle-opts:
    description: "Gradle JVM options"
    required: false
    default: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

runs:
  using: composite
  steps:
    - name: Run unit tests (excluding integration tests)
      shell: bash
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
      run: ./gradlew test -x integrationTest

    - name: Upload test results
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: always()
      with:
        name: unit-test-results
        path: |
          build/test-results/test/
          build/reports/tests/test/
        retention-days: 7  # Short retention (reviewed quickly)

    - name: Upload coverage report
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: always()
      with:
        name: unit-test-coverage
        path: build/reports/jacoco/test/html/
        retention-days: 30  # Medium retention (trend analysis)

    - name: Verify coverage threshold (≥70%)
      shell: bash
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
      run: |
        ./gradlew jacocoTestCoverageVerification || {
          echo "::error::Coverage threshold not met (required: ≥70%)"
          echo "Check build/reports/jacoco/test/html/index.html for details"
          exit 1
        }