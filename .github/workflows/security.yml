---
name: Security Audit

on:
  # Manual trigger only
  workflow_dispatch:
# Prevent concurrent security scans
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Build Configuration
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15 # OWASP dependency analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Run OWASP Dependency Check
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload dependency check report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check-report
          path: |
            build/reports/dependency-check/
          retention-days: 90  # Long retention (audit trail)

  vulnerability-summary:
    name: Generate Vulnerability Summary
    runs-on: ubuntu-latest
    needs: [dependency-check]
    if: always()

    steps:
      - name: Download dependency check report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-check-report
          path: dependency-reports/

      - name: Generate summary
        run: |
          echo "# Security Audit Summary" > security-summary.md
          echo "Generated on: $(date)" >> security-summary.md
          echo "" >> security-summary.md

          echo "## Dependency Vulnerabilities (OWASP)" >> security-summary.md
          if [ -f "dependency-reports/dependency-check-report.html" ]; then
            echo "✅ Dependency check completed. Check the HTML report for details." >> security-summary.md
          else
            echo "❌ Dependency check report not found." >> security-summary.md
          fi

          echo "" >> security-summary.md
          echo "## Static Analysis (SpotBugs)" >> security-summary.md
          echo "ℹ️  SpotBugs runs in PR validation and main workflow." >> security-summary.md
          echo "   Check those workflows for security findings." >> security-summary.md

          echo "" >> security-summary.md
          echo "## Next Steps" >> security-summary.md
          echo "1. Review the OWASP dependency report" >> security-summary.md
          echo "2. Address any HIGH or CRITICAL vulnerabilities" >> security-summary.md
          echo "3. Update dependencies via Dependabot PR" >> security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-summary
          path: security-summary.md
          retention-days: 90  # Long retention (audit trail)

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # For uploading to Security tab
      id-token: write  # OIDC authentication for registry login
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull latest image
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest || {
            echo "::warning::Latest image not found, skipping scan"
            exit 0
          }
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail workflow on vulnerabilities
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 90
