---
name: Pull Request Validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
# Allow only one concurrent PR validation per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Build Configuration
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  TESTCONTAINERS_REUSE_ENABLE: "true"

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  test:
    name: Run Test Suite
    uses: ./.github/workflows/test.yml
    with:
      gradle-opts: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      testcontainers-reuse: "true"

  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Validate docker-compose.yml
        run: |
          docker compose --env-file env.sample -f docker-compose.yml config > /dev/null || {
            echo "::error::docker-compose.yml is invalid"
            exit 1
          }
      
      - name: Validate docker-compose.infrastructure.yml
        run: |
          docker compose --env-file env.sample -f docker-compose.yml -f docker-compose.infrastructure.yml config > /dev/null || {
            echo "::error::docker-compose.infrastructure.yml is invalid"
            exit 1
          }
      
      - name: Validate docker-compose.prod.yml
        run: |
          docker compose --env-file env.sample -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null || {
            echo "::error::docker-compose.prod.yml is invalid"
            exit 1
          }
      
      - name: Validate docker-compose.dev.yml
        run: |
          docker compose --env-file env.sample -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null || {
            echo "::error::docker-compose.dev.yml is invalid"
            exit 1
          }
